# XcodeGen spec for DockMole — macOS native app.
#
# Run once:
#   brew install xcodegen
# Then in this directory:
#   xcodegen generate
#   open DockMoleMac.xcodeproj
#
# Why a separate native app instead of Mac Catalyst from the iOS DockMole:
# the user picked Option C — native macOS — for proper Mac UX (real
# menus, NSSidebar, multi-window). Initial scaffold ships a placeholder
# NavigationSplitView matching the iOS feature set (Search / Docking /
# Results) plus the Window-menu reopen handler from day one so we
# never hit the Apple guideline 4 rejection that bit AtomizerMac +
# ElectronVisualizedMac.

name: DockMoleMac

options:
  bundleIdPrefix: com.johnseong
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true

settings:
  base:
    DEVELOPMENT_TEAM: Z64KRUX3W3
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: "YES"
    ENABLE_HARDENED_RUNTIME: "YES"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    CODE_SIGN_ENTITLEMENTS: DockMoleMac.entitlements

targets:
  DockMoleMac:
    type: application
    platform: macOS
    sources:
      - path: Sources/DockMoleMac
        excludes:
          - "**/*.md"
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: DockMole
        LSApplicationCategoryType: public.app-category.education
        NSHumanReadableCopyright: "© 2026 John Seong"
        # WebKit fallback view (the 'Open full DockMole in browser →'
        # button) needs network-client to reach the public web app.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsInWebContent: true
    settings:
      base:
        # Distinct from the iOS DockMole bundle (com.johnseong.dock-it)
        # because the codebases are completely different — Mac is
        # SwiftUI, iOS is React Native. Separate ASC entry.
        PRODUCT_BUNDLE_IDENTIFIER: com.johnseong.dockmole-mac
        PRODUCT_NAME: DockMole
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

schemes:
  DockMoleMac:
    build:
      targets:
        DockMoleMac: all
    run:
      config: Debug
    archive:
      config: Release
