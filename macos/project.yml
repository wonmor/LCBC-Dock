# XcodeGen spec for MolDock — macOS native app.
#
# Run once:
#   brew install xcodegen
# Then in this directory:
#   xcodegen generate
#   open MolDockMac.xcodeproj
#
# Bundle shared with iOS MolDock (com.johnseong.dock-it) so App Store
# Connect ships them as one universal product page across iPhone +
# iPad + Mac. Codebases are independent — iOS is React Native via
# Expo, Mac is native SwiftUI — but the same Apple ID + same
# subscription entitlements transfer cross-platform.

name: MolDockMac

options:
  bundleIdPrefix: com.johnseong
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true

settings:
  base:
    DEVELOPMENT_TEAM: Z64KRUX3W3
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: "YES"
    ENABLE_HARDENED_RUNTIME: "YES"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    CODE_SIGN_ENTITLEMENTS: MolDockMac.entitlements

targets:
  MolDockMac:
    type: application
    platform: macOS
    sources:
      - path: Sources/MolDockMac
        excludes:
          - "**/*.md"
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: MolDock
        LSApplicationCategoryType: public.app-category.education
        NSHumanReadableCopyright: "© 2026 John Seong"
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsInWebContent: true
    settings:
      base:
        # Same as iOS MolDock — App Store Connect treats them as one
        # universal app under a single SKU. Same subscription
        # entitlements transfer.
        PRODUCT_BUNDLE_IDENTIFIER: com.johnseong.dock-it
        PRODUCT_NAME: MolDock
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "2"
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

schemes:
  MolDockMac:
    build:
      targets:
        MolDockMac: all
    run:
      config: Debug
    archive:
      config: Release
